# nginx: BarberSaaS — статика Mini App + reverse proxy на API
# Куда положить: /etc/nginx/sites-available/barbersaas

server {
    listen 80;
    server_name _;

    # Статика собранного frontend (vite build)
    root /var/www/barbersaas;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API -> uvicorn на localhost
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health { proxy_pass http://127.0.0.1:8000/health; }
    location = /ready  { proxy_pass http://127.0.0.1:8000/ready; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8000/openapi.json; }
    location = /docs   { proxy_pass http://127.0.0.1:8000/docs; }

    # SPA-роутинг: всё остальное отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 10m;
}
